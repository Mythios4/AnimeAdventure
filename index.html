<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mythios — Anime Adventures</title>
  <meta name="description" content="Keyless Anime Adventures loader" />
  <style>
    :root {
      --bg: #07070a;
      --card: #121218;
      --border: #23232e;
      --text: #e8e8f0;
      --muted: #8b8b9e;
      --accent: #7c5cff;
      --accent2: #00d4aa;
      --success: #22c55e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 92, 255, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 212, 170, 0.08), transparent);
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .stats {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .stat {
      background: #1a1a22;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat span {
      color: var(--text);
      font-weight: 600;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .code-box {
      background: #0c0c10;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.55;
      color: #7ee787;
      word-break: break-all;
      margin-bottom: 20px;
      position: relative;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #5b3fd4);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
    }

    .btn:active { transform: translateY(0); }

    .btn.copied {
      background: linear-gradient(135deg, var(--success), #16a34a);
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 212, 170, 0.1);
      color: var(--accent2);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="brand">
          <h1>Mythios</h1>
          <p>Anime Adventures Loader</p>
        </div>
        <div class="stats">
          <div class="stat">👁 <span id="views">—</span></div>
          <div class="stat">📋 <span id="copies">0</span></div>
        </div>
      </div>

      <div class="badge">● Keyless • One-click</div>

      <div class="label">Your Script</div>
      <div class="code-box" id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/Mythios4/AnimeAdventures/refs/heads/main/script.lua"))()
      </div>

      <button class="btn" id="copyBtn" onclick="copyScript()">Copy Script</button>

      <div class="footer">
        Paste in any executor • Works on most builds
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIG ==========
    // Optional: put your Discord webhook here to get real-time copy pings
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1574379752482017342/HgEcMm9Dz_IB4ubUYErSfZruIkKmWcvzqKCwNvenDTolYigx3XrAz29kgp98NykV4Vma";   // example: "https://discord.com/api/webhooks/..."

    const SCRIPT = document.getElementById("script").innerText.trim();
    let copyCount = parseInt(localStorage.getItem("mythios_copies") || "0");

    document.getElementById("copies").textContent = copyCount;

    // Simple free view counter (finicounter)
    (function() {
      const s = document.createElement("script");
      s.src = "https://finicounter.eu.org/finicounter.js";
      s.async = true;
      document.head.appendChild(s);

      // Fallback display
      setTimeout(() => {
        const el = document.getElementById("finicount_views");
        if (el) {
          document.getElementById("views").textContent = el.innerText;
        } else {
          // manual fallback count via local
          let v = parseInt(localStorage.getItem("mythios_views") || "0") + 1;
          localStorage.setItem("mythios_views", v);
          document.getElementById("views").textContent = v;
        }
      }, 1200);
    })();

    async function copyScript() {
      try {
        await navigator.clipboard.writeText(SCRIPT);
      } catch (e) {
        // fallback
        const ta = document.createElement("textarea");
        ta.value = SCRIPT;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      // update local copy count
      copyCount++;
      localStorage.setItem("mythios_copies", copyCount);
      document.getElementById("copies").textContent = copyCount;

      // button feedback
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy Script";
        btn.classList.remove("copied");
      }, 1800);

      // Discord ping (optional)
      if (DISCORD_WEBHOOK) {
        fetch(DISCORD_WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: `**Script copied** • ${new Date().toLocaleString()}\nTotal copies (this browser): ${copyCount}`
          })
        }).catch(() => {});
      }
    }
  </script>

  <!-- hidden for finicounter -->
  <span id="finicount_views" style="display:none"></span>
</body>
</html>
