<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Adventures Script</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f12;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1a1a20;
            border: 1px solid #2a2a32;
            border-radius: 16px;
            padding: 32px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #fff;
        }
        .sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }
        .code-box {
            background: #0d0d10;
            border: 1px solid #2a2a32;
            border-radius: 10px;
            padding: 16px;
            font-family: "SF Mono", "Fira Code", Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-all;
            color: #7ee787;
            margin-bottom: 20px;
            position: relative;
        }
        button {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s;
        }
        button:hover { background: #2ea043; }
        button.copied { background: #1a7f37; }
        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Anime Adventures</h1>
        <div class="sub">Paste this in your executor</div>

        <div class="code-box" id="script">
loadstring(game:HttpGet("https://raw.githubusercontent.com/Mythios4/AnimeAdventures/refs/heads/main/script.lua"))()
        </div>

        <button onclick="copyScript()" id="btn">Copy Script</button>

        <div class="note">Works on most executors • Keyless</div>
    </div>

    <script>
        function copyScript() {
            const text = document.getElementById("script").innerText.trim();
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById("btn");
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = "Copy Script";
                    btn.classList.remove("copied");
                }, 2000);
            });
        }
    </script>
</body>
</html>
